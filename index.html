<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Existentialist Café</title>
    <link rel="shortcut icon" href="assets/img/WebsiteLogo.png" />
</head>

<body>
    <audio autoplay>
        <source src="assets/audio/laugedybet.wav" type="audio/wav">
        Your browser does not support the audio element.
    </audio>

    <div id="cursor-spotlight"></div>

    <div class="container" id="container">
        <div id="particles"></div>
        <div id="mirror"></div>
        <div id="background"></div>
    </div>

    <div class="heading">
        <h1 class="title">Welcome to the Existentialist Café!</h1>
        <h4 class="subtitle">Having been "thrown" into the world,<br />we constantly create and recreate our own essence as our lives unfold...</h4>
    </div>

    <div class="square-container" id="square-container"></div>

        <div class="stage">
            <div class="collage-art">
                <div id="time">What Time Is It Now?</div>
                <div id="location"><h4>- ! & Here I Am! -</h4></div>
                <div id="start"><h5>Inside the Café,<br />our existence always precedes our<span id="essence">essence.</span></h5></div>
                
                <img class="art art-open-book" src="assets/img/openbook.png" alt="">
                <img class="art art-broken-chain" src="assets/img/brokenchain.png" alt="">
                <img class="art art-cafe-de-flore" src="assets/img/cafedeflore.png" alt="">
                <img class="art art-eiffle-tower" src="assets/img/eiffletower.png" alt="">
                <img class="art art-sunlight" src="assets/img/sunlight.png" alt="">
                <img class="art art-tree-and-sunlight" src="assets/img/treeandsunlight.png" alt="">
                <img class="art art-walkingman-1" src="assets/img/walkingman.png" alt="">
                <img class="art art-walkingman-2 art-mirrored-x" src="assets/img/walkingman.png" alt="">
                <img class="art art-wall-clock" src="assets/gif/wallclock.gif" alt="">
                <img class="art art-cloud" src="assets/gif/cloud.gif" alt="">
                <img class="art art-earth-rotate" src="assets/gif/earthrotate.gif" alt="">
                <img class="art art-location-pin" src="assets/gif/locationpin.gif" alt="">
            </div>

            <div class="collage-art collage-art--mirror" aria-hidden="true">
                <img class="art art-open-book" src="assets/img/openbook.png" alt="">
                <img class="art art-broken-chain" src="assets/img/brokenchain.png" alt="">
                <img class="art art-cafe-de-flore" src="assets/img/cafedeflore.png" alt="">
                <img class="art art-eiffle-tower" src="assets/img/eiffletower.png" alt="">
                <img class="art art-sunlight" src="assets/img/sunlight.png" alt="">
                <img class="art art-tree-and-sunlight" src="assets/img/treeandsunlight.png" alt="">
                <img class="art art-walkingman-1" src="assets/img/walkingman.png" alt="">
                <img class="art art-walkingman-2 art-mirrored-x" src="assets/img/walkingman.png" alt="">
                <img class="art art-wall-clock" src="assets/gif/wallclock.gif" alt="">
                <img class="art art-cloud" src="assets/gif/cloud.gif" alt="">
                <img class="art art-earth-rotate" src="assets/gif/earthrotate.gif" alt="">
                <img class="art art-location-pin" src="assets/gif/locationpin.gif" alt="">
            </div>

            <div class="circle" id="circle">
                <img id="circletravel" src="assets/gif/circletravel.gif" alt="">
                <button id="who-am-i" type="button">Who Am I?</button>
                <button id="starting-point" type="button">What Do I Do?</button>
            </div>
        </div>
    </div>

    <video id="video" autoplay playsinline muted loop>
        <source src="assets/video/timetravel.mp4" type="video/mp4">
        Loading...
    </video>

    <script src="js/particles.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
